
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Vegan Cafe</title>

    <!-- Using your existing CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Gallery-specific styling -->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        nav {
            background-color: #263b2b;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #c9dfb5;
        }

        .gallery-heading {
            text-align: center;
            padding: 35px 15px;
        }

        .gallery-heading h1 {
            color: #263b2b;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .gallery-item {
            background-color: #f5f5f0;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        .gallery-item p {
            font-weight: bold;
            padding: 12px;
        }

        footer {
            background-color: #263b2b;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .gallery-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery-container {
                grid-template-columns: 1fr;
            }

            nav a {
                margin: 0 8px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html">Menu</a>
        <a href="gallery.html">Gallery</a>
    </nav>

    <!-- Gallery Heading -->
    <div class="gallery-heading">
        <h1>Our Drinks Gallery</h1>
        <p>Fresh, delicious and 100% Natural!</p>
    </div>

    <!-- Food Gallery -->
    <div class="gallery-container">

        <div class="gallery-item">
            <img src="coffe1.png"
                 alt="Fresh vegetable salad">
            <p>Fresh Garden Salad</p>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1525351484163-7529414344d8"
                 alt="Avocado toast">
            <p>Avocado Toast</p>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd"
                 alt="Healthy vegan bowl">
            <p>Healthy Vegan Bowl</p>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1490645935967-10de6ba17061"
                 alt="Healthy breakfast">
            <p>Healthy Breakfast</p>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93"
                 alt="Fresh coffee">
            <p>Freshly Brewed Coffee</p>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352"
                 alt="Fresh healthy food">
            <p>Fresh Plant-Based Meal</p>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Vegan Cafe. All Rights Reserved.</p>
        <p>Fresh Food | Fresh Coffee | Healthy Living</p>
    </footer>

</body>
</html>
